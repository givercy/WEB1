<!DOCTYPE html> <!--Declara que o codigo será realizado pelo HTML 5 (ou "Living Standard" que significa: Versao em constante atualização") -->

<html lang="pt-br"> <!--Indica o inicio do documento e idioma, neste caso pt-br-->
<head><!--contem configuracoes da pagina nao visiveis-->
    <meta charset="UTF-8"> <!--Realiza codificacao de caracteres, neste caso permitindo a acentuacao-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta a página para diferentes tamanhos de tela.-->
    <title>atividade html 01</title> <!--Define o titulo da aba no navegador-->
</head>
<body> <!--Área visível da página.-->
    <h1> <!--Titulo principal-->
        Bem vindo a pagina de atividades de html UNEB
        
    </h1>
    <hr> <!--Cria uma linha que permite separar os topicos-->
    <div> <!--agrupamento-->
        <p> <!--Cria paragrafos-->
            Este é meu primeiro paragrafo feito no <strong>HTML</strong>  <!--Cria negrito-->
        </p>
        <p>
            continuo aprendendo<br> html <br> <!--Quebra linha--> Com <a href="https://portalacademico.uneb.br/portalsagres/Acesso.aspx" target="_blank">este link</a> Voce vai para o portal Sagres da Uneb <!--Cria um hyperlink com o enderesso e texto que desejar-->
            <br>
            Com este codigo eu mostro o sinal de menor que: &lt;<!--Insere o simbolo de "<"-->
        </p>
        <p>O <span style="color:rgb(255, 127, 8);">HTLM é a base da WEB</span></p> <!--Permite personalizar a cor do texto-->
        <a href="https://portalacademico.uneb.br/portalsagres/Acesso.aspx" target="_blank">google</a>
        <br>
        <img src="assets/sla.JPEG.jpeg" alt="Imagens de uma escola hipotetica"> <!--img src="assets/sla.JPEG.jpeg" define a imagem e o caminho do enderesso dela que deve estar na pasta do documento, no caso, "Assets"-->
        <img src="https://imgs.search.brave.com/4lcAicFYHLkRMkKmpVWZ1H4TYUdOPBt4BsmHMMESWto/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93YWxs/cGFwZXJjYXZlLmNv/bS93cC93cDI2MTA2/MjgucG5n" alt="imagem do jogo Terraria"> <!--Tambem é possivel inserir imagens através do link de uma imagem na web-->
    </div>
    
</body>

</html><!--Declara o fim do documento-->
